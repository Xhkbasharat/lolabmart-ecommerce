services:
  - type: web
    name: lolabmart
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: FLASK_DEBUG
        value: "0"

      - key: RENDER
        value: "true"
